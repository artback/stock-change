[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-price"
dynamic = ["version"]
description = "A simple CLI to track stock prices and dividends"
dependencies = [
    "yfinance>=0.2.40",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
mcp = [
    "mcp>=2.0.0",
    # Round-trips the holdings YAML so editing it keeps comments and key order.
    "ruamel.yaml>=0.18.0",
]
dev = [
    # So CI exercises the MCP server and the comment-preserving config writer.
    "stock-price[mcp]",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0"
]

[project.scripts]
stock-price = "stock:fetch_portfolio"
stock-price-mcp = "stock_mcp:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=stock --cov-report=term-missing"

[tool.coverage.run]
source = ["stock"]
omit = ["tests/*", "venv/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.setuptools]
py-modules = ["stock", "stock_mcp"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
